services:
  casdoor:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: STANDARD
    entrypoint: /bin/sh -c './server --createDatabase=true'
    ports:
      - "8080:8080"
    environment:
      RUNNING_IN_DOCKER: "true"
      # Password of built-in/admin when Casdoor creates the database. It applies only to a
      # new database; leave it commented to set the password on the /init-admin page.
      # initAdminPassword: "change-me"
    volumes:
      - ./conf:/conf/
